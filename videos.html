<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ویدیوها | زیگورات سازان</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-deep: #fcf9f5; --bg-card: rgba(255,255,255,0.8); --brick: #c44536; --text-primary: #2c241b;
            --border-subtle: rgba(196,69,54,0.2); --navbar-bg: rgba(255,255,255,0.85); --footer-bg: #f7f3ee;
        }
        body.dark-mode {
            --bg-deep: #1c1a18; --bg-card: rgba(42,37,33,0.8); --brick: #d6685a; --text-primary: #ece6df;
            --border-subtle: rgba(214,104,90,0.3); --navbar-bg: rgba(28,26,24,0.85); --footer-bg: #1c1a18;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background:var(--bg-deep); color:var(--text-primary); transition:0.4s; }
        .navbar {
            position:fixed; top:0; left:0; right:0; z-index:1000; padding:1rem 2rem;
            display:flex; align-items:center; justify-content:space-between;
            background:var(--navbar-bg); backdrop-filter:blur(20px); border-bottom:1px solid var(--border-subtle);
        }
        .nav-brand { display:flex; align-items:center; gap:0.5rem; text-decoration:none; }
        .brand-icon { width:44px; height:44px; background:linear-gradient(135deg, #8b3a32, var(--brick)); border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:1.4rem; color:#fff; }
        .brand-text { font-size:1.6rem; font-weight:800; color:var(--text-primary); } .brand-text span { color:var(--brick); }
        .nav-links { display:flex; list-style:none; gap:1.8rem; }
        .nav-links a { text-decoration:none; color:var(--text-secondary); font-weight:500; } .nav-links a:hover { color:var(--brick); }
        .theme-toggle { background:var(--bg-card); border:1px solid var(--border-subtle); color:var(--text-primary); width:38px; height:38px; border-radius:8px; cursor:pointer; }
        .container { max-width:800px; margin:0 auto; padding:6rem 2rem 2rem; text-align:center; }
        .icon-big { font-size:5rem; color:var(--brick); margin-bottom:2rem; }
        .footer { background:var(--footer-bg); border-top:1px solid var(--border-subtle); padding:2rem; text-align:center; margin-top:4rem; }
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="index.html" class="nav-brand"><div class="brand-icon"><i class="fa-solid fa-hard-hat"></i></div><span class="brand-text">زیگورات<span>سازان</span></span></a>
        <ul class="nav-links">
            <li><a href="index.html">صفحه اصلی</a></li><li><a href="projects.html">پروژه‌ها</a></li>
            <li><a href="services.html">خدمات ما</a></li><li><a href="videos.html" style="color:var(--brick)">ویدیو ها</a></li>
            <li><a href="blog.html">وبلاگ</a></li><li><a href="about.html">درباره ما</a></li><li><a href="contact.html">تماس با ما</a></li>
        </ul>
        <button class="theme-toggle" id="themeToggle"><i class="fa-solid fa-sun"></i></button>
    </nav>

    <div class="container">
        <i class="fa-solid fa-film icon-big"></i>
        <h2>گالری ویدیویی</h2>
        <p style="margin-top:1rem;">ویدیوهای پروژه‌ها و آموزش‌های ساختمانی به‌زودی در این بخش قرار خواهند گرفت.</p>
    </div>

    <footer class="footer"><p>© ۲۰۲۶ تمامی حقوق برای شرکت معماری زیگورات سازان محفوظ است.</p></footer>
    <script>
        const toggle = document.getElementById('themeToggle');
        if (localStorage.getItem('ziggurat-theme') === 'dark') { document.body.classList.add('dark-mode'); }
        toggle.addEventListener('click', () => {
            document.body.classList.toggle('dark-mode');
            localStorage.setItem('ziggurat-theme', document.body.classList.contains('dark-mode') ? 'dark' : 'light');
        });
    </script>
</body>
</html>
