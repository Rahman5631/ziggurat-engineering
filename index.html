<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#000000">
<title>Zigguratsazan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
  }

  :root {
    --bg: #000000;
    --orange: #f5a623;
    --orange-l: #ffc761;
    --orange-d: #e08b1f;
    --grad-txt: linear-gradient(180deg, #ffc761 0%, #f5a623 100%);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
  }

  html, body {
    height: 100%;
    overflow: hidden;
    overscroll-behavior: none;
  }

  body {
    font-family: 'Inter', 'Vazirmatn', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--orange);
    position: fixed;
    inset: 0;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  /* ==========================================
     PAGE FRAME BORDER — corner brackets only
     ========================================== */
  .page-frame {
    position: fixed;
    inset: 12px;
    z-index: 20;
    pointer-events: none;
  }
  .page-frame .corner {
    position: absolute;
    width: 22px;
    height: 22px;
    border: 2px solid var(--orange-l);
    opacity: 0.85;
    animation: cornerPulse 4s ease-in-out infinite;
  }
  @keyframes cornerPulse {
    0%, 100% { opacity: 0.5; border-color: #ffc761; }
    50% { opacity: 1; border-color: #f5a623; }
  }
  .page-frame .tl { top: 0; left: 0; border-right: none; border-bottom: none; }
  .page-frame .tr { top: 0; right: 0; border-left: none; border-bottom: none; }
  .page-frame .bl { bottom: 0; left: 0; border-right: none; border-top: none; }
  .page-frame .br { bottom: 0; right: 0; border-left: none; border-top: none; }

  /* ==========================================
     HEADER (top) — two lines
     ========================================== */
  .header {
    position: absolute;
    top: max(28px, 3.5vh);
    left: 0;
    right: 0;
    text-align: center;
    user-select: none;
    pointer-events: none;
    z-index: 5;
  }

  .small-line {
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    font-weight: 400;
    letter-spacing: 0.5em;
    text-transform: uppercase;
    background: var(--grad-txt);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    color: transparent;
    margin-bottom: 8px;
    margin-left: 0.5em;
    opacity: 0;
    transform: translateX(60px);
    animation: slideRTL 1.6s var(--ease) 5s forwards;
  }

  @keyframes slideRTL {
    0% { opacity: 0; transform: translateX(60px); letter-spacing: 0.9em; }
    100% { opacity: 1; transform: translateX(0); letter-spacing: 0.5em; }
  }

  .big-line {
    font-family: 'Inter', sans-serif;
    font-size: clamp(26px, 8.5vw, 42px);
    font-weight: 400;
    letter-spacing: 0.01em;
    white-space: nowrap;
    direction: ltr;
  }

  .big-line .letter {
    display: inline-block;
    background: var(--grad-txt);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    color: transparent;
    opacity: 0;
    transform: translateX(-30px);
    animation: letterLTR 0.9s var(--ease) forwards;
    /* delay set inline from JS */
  }

  @keyframes letterLTR {
    0% { opacity: 0; transform: translateX(-30px); }
    70% { opacity: 1; transform: translateX(3px); }
    100% { opacity: 1; transform: translateX(0); }
  }

  /* ==========================================
     STAGE (tap area)
     ========================================== */
  .stage {
    position: fixed;
    inset: 0;
    z-index: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 14vh 8vw 18vh;
    cursor: pointer;
  }

  /* ==========================================
     MAIN FRAME (rectangle)
     ========================================== */
  .frame {
    position: relative;
    width: 100%;
    max-width: 460px;
    aspect-ratio: 10 / 14;
    transform: scale(0.15);
    opacity: 0;
    animation: frameGrow 3s var(--ease) 5.4s forwards;
  }

  @keyframes frameGrow {
    0% { transform: scale(0.15); opacity: 0; }
    40% { opacity: 1; }
    70% { transform: scale(1.03); }
    100% { transform: scale(1); opacity: 1; }
  }

  /* Rectangle border with animated gradient */
  .frame-border {
    position: absolute;
    inset: 0;
    pointer-events: none;
    animation: borderColorShift 8s ease-in-out infinite;
  }

  @keyframes borderColorShift {
    0%, 100% {
      filter: hue-rotate(0deg) brightness(1);
    }
    50% {
      filter: hue-rotate(-15deg) brightness(1.15);
    }
  }

  /* Alternative: animate stroke color of the SVG lines directly */
  .frame-border line {
    animation: strokeColorShift 8s ease-in-out infinite;
  }
  .frame-border line:nth-child(1) { animation-delay: 0s; }
  .frame-border line:nth-child(2) { animation-delay: 0.15s; }
  .frame-border line:nth-child(3) { animation-delay: 0.3s; }
  .frame-border line:nth-child(4) { animation-delay: 0.45s; }

  @keyframes strokeColorShift {
    0%, 100% { stroke: #ffc761; }
    33% { stroke: #f5a623; }
    66% { stroke: #e08b1f; }
  }

  .frame-inner {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    padding: 12px;
  }

  /* ==========================================
     VILLA SVG
     ========================================== */
  .villa {
    width: 100%;
    height: 100%;
    overflow: visible;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .villa svg {
    width: 100%;
    height: 100%;
    max-height: 100%;
    overflow: visible;
  }

  .draw {
    stroke-dasharray: var(--len, 400);
    stroke-dashoffset: var(--len, 400);
    animation: drawLine 2.4s var(--ease) forwards;
  }
  @keyframes drawLine {
    to { stroke-dashoffset: 0; }
  }

  .fade-in {
    opacity: 0;
    animation: fadeIn 2s var(--ease) forwards;
  }
  @keyframes fadeIn {
    to { opacity: 1; }
  }

  .float-slow {
    animation: floatY 8s ease-in-out infinite;
    transform-origin: center;
  }
  @keyframes floatY {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-3px); }
  }

  .pulse-soft {
    animation: pulseSoft 5s ease-in-out infinite;
  }
  @keyframes pulseSoft {
    0%, 100% { opacity: 0.5; }
    50% { opacity: 1; }
  }

  .shimmer {
    animation: shimmer 6s ease-in-out infinite;
  }
  @keyframes shimmer {
    0%, 100% { opacity: 0.3; }
    50% { opacity: 0.9; }
  }

  .dust {
    animation: dustFloat 7s ease-in-out infinite;
  }
  @keyframes dustFloat {
    0%, 100% { opacity: 0.15; transform: translateY(0); }
    50% { opacity: 0.8; transform: translateY(-7px); }
  }

  /* ==========================================
     BOTTOM DOCK
     ========================================== */
  .dock {
    position: absolute;
    bottom: calc(3vh + var(--safe-bottom));
    left: 6vw;
    right: 6vw;
    max-width: 480px;
    margin-inline: auto;
    padding: 12px 8px;
    opacity: 0;
    transform: translateY(40px);
    pointer-events: none;
    transition: opacity 0.9s var(--ease), transform 0.9s var(--ease);
    z-index: 10;
  }

  body.dock-visible .dock {
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto;
  }

  .dock-inner {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 2px;
  }

  .dock-btn {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 5px;
    padding: 6px 2px;
    text-decoration: none;
    background: none;
    border: none;
    cursor: pointer;
    opacity: 0;
    transform: translateY(20px) scale(0.7);
  }

  body.dock-visible .dock-btn {
    animation: btnIn 0.7s var(--ease) forwards;
  }
  body.dock-visible .dock-btn:nth-child(1) { animation-delay: 0.10s; }
  body.dock-visible .dock-btn:nth-child(2) { animation-delay: 0.20s; }
  body.dock-visible .dock-btn:nth-child(3) { animation-delay: 0.30s; }
  body.dock-visible .dock-btn:nth-child(4) { animation-delay: 0.40s; }
  body.dock-visible .dock-btn:nth-child(5) { animation-delay: 0.50s; }
  body.dock-visible .dock-btn:nth-child(6) { animation-delay: 0.60s; }
  body.dock-visible .dock-btn:nth-child(7) { animation-delay: 0.70s; }

  @keyframes btnIn {
    0% { opacity: 0; transform: translateY(20px) scale(0.7); }
    70% { opacity: 1; transform: translateY(-3px) scale(1.06); }
    100% { opacity: 1; transform: translateY(0) scale(1); }
  }

  .dock-btn svg {
    width: 26px;
    height: 26px;
    fill: none;
    stroke: url(#iconGrad);
    stroke-width: 1.7;
    stroke-linecap: round;
    stroke-linejoin: round;
    filter: drop-shadow(0 0 6px rgba(245, 166, 35, 0.55));
    transition: transform 0.4s var(--ease), filter 0.4s var(--ease);
  }

  .dock-btn:active svg {
    transform: scale(0.85);
    filter: drop-shadow(0 0 12px rgba(245, 166, 35, 0.9));
  }

  .dock-btn.active svg {
    filter: drop-shadow(0 0 10px rgba(245, 166, 35, 0.85));
  }

  .dock-btn .lbl {
    font-family: 'Vazirmatn', 'Inter', sans-serif;
    font-size: 0.6rem;
    font-weight: 500;
    color: #8a7a5f;
    transition: color 0.4s var(--ease);
    white-space: nowrap;
  }

  .dock-btn.active .lbl,
  .dock-btn:active .lbl {
    color: var(--orange-l);
  }

  .dock-line {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 2px;
    background-image: linear-gradient(90deg,
      var(--orange-l) 0 4px,
      transparent 4px 8px);
    background-size: 8px 100%;
    opacity: 0;
    transition: opacity 0.9s var(--ease) 0.3s;
  }

  body.dock-visible .dock-line {
    opacity: 0.85;
  }

  /* ==========================================
     MOBILE TUNING
     ========================================== */
  @media (max-width: 380px) {
    .frame {
      aspect-ratio: 10 / 13;
    }
    .small-line {
      font-size: 11px;
    }
    .big-line {
      font-size: 24px;
    }
    .dock-btn svg {
      width: 22px;
      height: 22px;
    }
    .dock-btn .lbl {
      font-size: 0.55rem;
    }
  }

  @media (min-height: 800px) {
    .frame {
      max-width: 440px;
      aspect-ratio: 10 / 13.5;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    * {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
    .frame { transform: scale(1); opacity: 1; }
    .draw { stroke-dashoffset: 0; }
    .fade-in { opacity: 1; }
    .big-line .letter { opacity: 1; transform: none; }
    .small-line { opacity: 1; transform: none; }
  }
</style>
</head>
<body>

  <!-- Hidden SVG defs for icon gradient -->
  <svg width="0" height="0" style="position:absolute;width:0;height:0;">
    <defs>
      <linearGradient id="iconGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#ffc761"/>
        <stop offset="100%" stop-color="#e08b1f"/>
      </linearGradient>
    </defs>
  </svg>

  <!-- ========== PAGE FRAME (corner brackets) ========== -->
  <div class="page-frame" aria-hidden="true">
    <span class="corner tl"></span>
    <span class="corner tr"></span>
    <span class="corner bl"></span>
    <span class="corner br"></span>
  </div>

  <!-- ========== HEADER (two lines) ========== -->
  <div class="header">
    <div class="small-line">Architecture</div>
    <div class="big-line" id="bigLine" aria-label="Zigguratsazan"></div>
  </div>

  <!-- ========== STAGE ========== -->
  <div class="stage" id="stage">

    <!-- ========== MAIN FRAME ========== -->
    <div class="frame" id="frame">

      <!-- Rectangle border — 4 solid gradient lines -->
      <svg class="frame-border" viewBox="0 0 400 560" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
        <line x1="0" y1="2" x2="400" y2="2" stroke="#ffc761" stroke-width="3"/>
        <line x1="0" y1="558" x2="400" y2="558" stroke="#ffc761" stroke-width="3"/>
        <line x1="2" y1="0" x2="2" y2="560" stroke="#ffc761" stroke-width="3"/>
        <line x1="398" y1="0" x2="398" y2="560" stroke="#ffc761" stroke-width="3"/>
      </svg>

      <!-- Villa SVG (centered) -->
      <div class="frame-inner">
        <div class="villa">
          <svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet" aria-label="Villa construction">
            <defs>
              <linearGradient id="gLine" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#ffc761"/>
                <stop offset="50%" stop-color="#f5a623"/>
                <stop offset="100%" stop-color="#e08b1f"/>
              </linearGradient>
              <linearGradient id="gLineH" x1="0" y1="0" x2="1" y2="0">
                <stop offset="0%" stop-color="#e08b1f"/>
                <stop offset="50%" stop-color="#ffc761"/>
                <stop offset="100%" stop-color="#e08b1f"/>
              </linearGradient>
              <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
                <feGaussianBlur stdDeviation="1.4" result="b"/>
                <feMerge>
                  <feMergeNode in="b"/>
                  <feMergeNode in="SourceGraphic"/>
                </feMerge>
              </filter>
              <filter id="glowSoft" x="-50%" y="-50%" width="200%" height="200%">
                <feGaussianBlur stdDeviation="2.5" result="b"/>
                <feMerge>
                  <feMergeNode in="b"/>
                  <feMergeNode in="SourceGraphic"/>
                </feMerge>
              </filter>
            </defs>

            <!-- Ground glow -->
            <ellipse class="pulse-soft" style="animation-delay:6.6s;" cx="200" cy="345" rx="130" ry="5"
                     fill="#f5a623" opacity="0.4" filter="url(#glowSoft)"/>

            <!-- Ground line -->
            <line class="draw" style="--len: 340; animation-delay:6.6s;"
                  x1="30" y1="345" x2="370" y2="345"
                  stroke="url(#gLineH)" stroke-width="2" filter="url(#glow)"/>

            <!-- Main volume -->
            <path class="draw" style="--len: 700; animation-delay:6.8s;"
                  d="M80 345 L80 170 L250 170 L250 345"
                  fill="none" stroke="url(#gLine)" stroke-width="2.2" filter="url(#glow)"/>

            <!-- Second volume -->
            <path class="draw" style="--len: 420; animation-delay:7.2s;"
                  d="M250 345 L250 220 L340 220 L340 345"
                  fill="none" stroke="url(#gLine)" stroke-width="2.2" filter="url(#glow)"/>

            <!-- Pitched roof -->
            <path class="draw" style="--len: 320; animation-delay:7.6s;"
                  d="M70 170 L165 110 L260 170"
                  fill="none" stroke="url(#gLine)" stroke-width="2.2" filter="url(#glow)"/>

            <!-- Flat roof -->
            <path class="draw" style="--len: 100; animation-delay:7.8s;"
                  d="M245 220 L345 220"
                  fill="none" stroke="url(#gLine)" stroke-width="2" filter="url(#glow)"/>

            <!-- Floor lines -->
            <line class="draw" style="--len: 175; animation-delay:8.0s;"
                  x1="80" y1="235" x2="250" y2="235"
                  stroke="url(#gLine)" stroke-width="1.4" opacity="0.85"/>
            <line class="draw" style="--len: 175; animation-delay:8.2s;"
                  x1="80" y1="290" x2="250" y2="290"
                  stroke="url(#gLine)" stroke-width="1.4" opacity="0.85"/>
            <line class="draw" style="--len: 90; animation-delay:8.3s;"
                  x1="250" y1="285" x2="340" y2="285"
                  stroke="url(#gLine)" stroke-width="1.4" opacity="0.85"/>

            <!-- Columns -->
            <line class="draw" style="--len: 130; animation-delay:8.4s;"
                  x1="135" y1="235" x2="135" y2="345"
                  stroke="url(#gLine)" stroke-width="1.2" opacity="0.7"/>
            <line class="draw" style="--len: 130; animation-delay:8.5s;"
                  x1="195" y1="235" x2="195" y2="345"
                  stroke="url(#gLine)" stroke-width="1.2" opacity="0.7"/>

            <!-- Windows (shimmer) -->
            <rect class="shimmer" style="animation-delay:8.6s;" x="95" y="300" width="22" height="30" fill="url(#gLine)" opacity="0.35"/>
            <rect class="shimmer" style="animation-delay:8.8s;" x="145" y="300" width="22" height="30" fill="url(#gLine)" opacity="0.35"/>
            <rect class="shimmer" style="animation-delay:9.0s;" x="195" y="300" width="22" height="30" fill="url(#gLine)" opacity="0.35"/>
            <rect class="shimmer" style="animation-delay:8.7s;" x="95" y="245" width="22" height="30" fill="url(#gLine)" opacity="0.35"/>
            <rect class="shimmer" style="animation-delay:8.9s;" x="145" y="245" width="22" height="30" fill="url(#gLine)" opacity="0.35"/>
            <rect class="shimmer" style="animation-delay:9.1s;" x="195" y="245" width="22" height="30" fill="url(#gLine)" opacity="0.35"/>
            <rect class="shimmer" style="animation-delay:8.8s;" x="95" y="185" width="22" height="34" fill="url(#gLine)" opacity="0.3"/>
            <rect class="shimmer" style="animation-delay:9.1s;" x="145" y="185" width="22" height="34" fill="url(#gLine)" opacity="0.3"/>
            <rect class="shimmer" style="animation-delay:8.9s;" x="265" y="295" width="20" height="28" fill="url(#gLine)" opacity="0.35"/>
            <rect class="shimmer" style="animation-delay:9.2s;" x="300" y="295" width="20" height="28" fill="url(#gLine)" opacity="0.35"/>
            <rect class="shimmer" style="animation-delay:9.1s;" x="265" y="240" width="20" height="28" fill="url(#gLine)" opacity="0.3"/>
            <rect class="shimmer" style="animation-delay:9.4s;" x="300" y="240" width="20" height="28" fill="url(#gLine)" opacity="0.3"/>

            <!-- Crane hook -->
            <g class="float-slow" style="animation-delay:7.7s;">
              <line class="draw" style="--len: 90; animation-delay:9.1s;"
                    x1="330" y1="60" x2="330" y2="150"
                    stroke="url(#gLine)" stroke-width="1.4" opacity="0.85"/>
              <path class="draw" style="--len: 60; animation-delay:9.5s;"
                    d="M330 150 L330 160 Q330 172 318 172 Q310 172 310 164 L310 160"
                    fill="none" stroke="url(#gLine)" stroke-width="2" filter="url(#glow)"/>
              <rect class="fade-in" style="animation-delay:9.8s;"
                    x="318" y="172" width="24" height="14"
                    fill="url(#gLine)" opacity="0.65" filter="url(#glow)"/>
            </g>

            <!-- Scaffolding -->
            <g class="fade-in" style="animation-delay:9.2s;">
              <line x1="70" y1="180" x2="70" y2="345" stroke="url(#gLine)" stroke-width="1.2" opacity="0.55"/>
              <line x1="58" y1="180" x2="58" y2="345" stroke="url(#gLine)" stroke-width="1.2" opacity="0.55"/>
              <line x1="58" y1="200" x2="80" y2="200" stroke="url(#gLine)" stroke-width="1" opacity="0.5"/>
              <line x1="58" y1="230" x2="80" y2="230" stroke="url(#gLine)" stroke-width="1" opacity="0.5"/>
              <line x1="58" y1="260" x2="80" y2="260" stroke="url(#gLine)" stroke-width="1" opacity="0.5"/>
              <line x1="58" y1="290" x2="80" y2="290" stroke="url(#gLine)" stroke-width="1" opacity="0.5"/>
              <line x1="58" y1="320" x2="80" y2="320" stroke="url(#gLine)" stroke-width="1" opacity="0.5"/>
            </g>

            <!-- Dust -->
            <circle class="dust" style="animation-delay:0s;" cx="110" cy="140" r="1.4" fill="#ffc761" filter="url(#glow)"/>
            <circle class="dust" style="animation-delay:2.3s;" cx="290" cy="180" r="1.2" fill="#ffc761" filter="url(#glow)"/>
            <circle class="dust" style="animation-delay:4.6s;" cx="200" cy="120" r="1.3" fill="#ffc761" filter="url(#glow)"/>
          </svg>
        </div>
      </div>
    </div>

    <!-- ========== BOTTOM DOCK ========== -->
    <nav class="dock" id="dock" aria-label="Main menu">
      <div class="dock-line" aria-hidden="true"></div>
      <div class="dock-inner">

        <a class="dock-btn active" href="index.html" aria-label="Home">
          <svg viewBox="0 0 24 24">
            <path d="M3 11.5 12 3l9 8.5"/>
            <path d="M5 10.5V20a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1v-9.5"/>
          </svg>
          <span class="lbl">خانه</span>
        </a>

        <a class="dock-btn" href="projects.html" aria-label="Projects">
          <svg viewBox="0 0 24 24">
            <path d="M4 21V6l7-3v18"/>
            <path d="M11 8h9v13"/>
            <line x1="7" y1="9" x2="7" y2="9.01"/>
            <line x1="7" y1="13" x2="7" y2="13.01"/>
            <line x1="7" y1="17" x2="7" y2="17.01"/>
            <line x1="15" y1="12" x2="15" y2="12.01"/>
            <line x1="15" y1="16" x2="15" y2="16.01"/>
          </svg>
          <span class="lbl">پروژه‌ها</span>
        </a>

        <a class="dock-btn" href="services.html" aria-label="Services">
          <svg viewBox="0 0 24 24">

  <script>
    (function () {
      "use strict";

      // ==========================================
      // BUILD TITLE — letter by letter (LTR)
      // Delays: 5.9s + i * 0.1s
      // ==========================================
      const bigLine = document.getElementById("bigLine");
      const text = "Zigguratsazan";
      let html = "";
      for (let i = 0; i < text.length; i++) {
        const delay = (5.9 + i * 0.1).toFixed(2);
        html += '<span class="letter" style="animation-delay:' + delay + 's">' + text[i] + '</span>';
      }
      bigLine.innerHTML = html;

      // ==========================================
      // TOGGLE DOCK ON PAGE TAP (after entrance done)
      // ==========================================
      const stage = document.getElementById("stage");
      const body = document.body;

      let ready = false;
      setTimeout(function () { ready = true; }, 11000); // after all entrance anims

      stage.addEventListener("click", function (e) {
        // Let dock links navigate normally
        if (e.target.closest(".dock")) return;
        if (!ready) return;
        body.classList.toggle("dock-visible");
      });

      // ==========================================
      // Prevent double-tap zoom & pinch zoom
      // ==========================================
      let lastTouchEnd = 0;
      document.addEventListener("touchend", function (event) {
        const now = Date.now();
        if (now - lastTouchEnd <= 300) event.preventDefault();
        lastTouchEnd = now;
      }, { passive: false });

      document.addEventListener("touchmove", function (e) {
        if (e.touches.length > 1) e.preventDefault();
      }, { passive: false });

    })();
  </script>
