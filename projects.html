<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#000000">
<title>Projects | Zigguratsazan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
  }

  :root {
    --bg: #000000;
    --orange: #f5a623;
    --orange-l: #ffc761;
    --orange-d: #e08b1f;
    --grad-txt: linear-gradient(180deg, #ffc761 0%, #f5a623 100%);
    --grad-line: linear-gradient(180deg, #ffc761 0%, #f5a623 50%, #e08b1f 100%);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    --safe-top: env(safe-area-inset-top, 0px);
    --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
  }

  html, body {
    height: 100%;
    overflow: hidden;
    overscroll-behavior: none;
  }

  body {
    font-family: 'Inter', 'Vazirmatn', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--orange);
    position: fixed;
    inset: 0;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  /* ==========================================
     PAGE FRAME — corner brackets
     ========================================== */
  .page-frame {
    position: fixed;
    inset: 12px;
    z-index: 20;
    pointer-events: none;
  }
  .page-frame .corner {
    position: absolute;
    width: 22px;
    height: 22px;
    border: 2px solid var(--orange-l);
    opacity: 0.85;
    animation: cornerPulse 4s ease-in-out infinite;
  }
  @keyframes cornerPulse {
    0%, 100% { opacity: 0.5; border-color: #ffc761; }
    50% { opacity: 1; border-color: #f5a623; }
  }
  .page-frame .tl { top: 0; left: 0; border-right: none; border-bottom: none; }
  .page-frame .tr { top: 0; right: 0; border-left: none; border-bottom: none; }
  .page-frame .bl { bottom: 0; left: 0; border-right: none; border-top: none; }
  .page-frame .br { bottom: 0; right: 0; border-left: none; border-top: none; }

  /* ==========================================
     HEADER
     ========================================== */
  .header {
    position: absolute;
    top: max(24px, 3.2vh);
    left: 0;
    right: 0;
    text-align: center;
    user-select: none;
    pointer-events: none;
    z-index: 5;
  }

  .small-line {
    font-family: 'Inter', sans-serif;
    font-size: 12px;
    font-weight: 400;
    letter-spacing: 0.5em;
    text-transform: uppercase;
    background: var(--grad-txt);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    color: transparent;
    margin-bottom: 6px;
    margin-left: 0.5em;
    opacity: 0;
    transform: translateX(60px);
    animation: slideRTL 1.4s var(--ease) 0.3s forwards;
  }

  @keyframes slideRTL {
    0% { opacity: 0; transform: translateX(60px); letter-spacing: 0.9em; }
    100% { opacity: 1; transform: translateX(0); letter-spacing: 0.5em; }
  }

  .big-line {
    font-family: 'Inter', sans-serif;
    font-size: clamp(22px, 7vw, 36px);
    font-weight: 400;
    letter-spacing: 0.01em;
    white-space: nowrap;
    direction: ltr;
  }

  .big-line .letter {
    display: inline-block;
    background: var(--grad-txt);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    color: transparent;
    opacity: 0;
    transform: translateX(-30px);
    animation: letterLTR 0.8s var(--ease) forwards;
  }

  @keyframes letterLTR {
    0% { opacity: 0; transform: translateX(-30px); }
    70% { opacity: 1; transform: translateX(3px); }
    100% { opacity: 1; transform: translateX(0); }
  }

  /* ==========================================
     FILTER BAR — horizontal scroll, no border, text only
     ========================================== */
  .filters {
    position: absolute;
    top: calc(max(24px, 3.2vh) + 88px);
    left: 0;
    right: 0;
    z-index: 6;
    overflow-x: auto;
    overflow-y: hidden;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none; /* Firefox */
    -ms-overflow-style: none; /* IE */
    padding: 8px 0 14px;
    /* fade edges */
    mask-image: linear-gradient(90deg, transparent 0, #000 20px, #000 calc(100% - 20px), transparent 100%);
    -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 20px, #000 calc(100% - 20px), transparent 100%);
  }
  .filters::-webkit-scrollbar {
    display: none; /* Chrome/Safari */
  }

  .filters-inner {
    display: inline-flex;
    align-items: center;
    gap: 26px;
    padding: 0 32px;
    white-space: nowrap;
    min-width: 100%;
    justify-content: center;
  }

  .filter-btn {
    font-family: 'Vazirmatn', 'Inter', sans-serif;
    font-size: 0.85rem;
    font-weight: 400;
    background: none;
    border: none;
    outline: none;
    padding: 6px 2px;
    color: #6f6350;
    cursor: pointer;
    transition: color 0.4s var(--ease), letter-spacing 0.4s var(--ease);
    letter-spacing: 0.3px;
    position: relative;
    white-space: nowrap;
  }

  .filter-btn::after {
    content: "";
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 1px;
    background: var(--grad-line);
    transform: scaleX(0);
    transform-origin: center;
    transition: transform 0.4s var(--ease);
  }

  .filter-btn:hover,
  .filter-btn:active {
    color: #d8bd8a;
  }

  .filter-btn.active {
    color: var(--orange-l);
    font-weight: 500;
  }

  .filter-btn.active::after {
    transform: scaleX(1);
  }

  /* ==========================================
     MAIN CONTENT (scrollable area)
     ========================================== */
  .content {
    position: absolute;
    top: calc(max(24px, 3.2vh) + 140px);
    left: 0;
    right: 0;
    bottom: calc(20vh + var(--safe-bottom));
    overflow-y: auto;
    overflow-x: hidden;
    -webkit-overflow-scrolling: touch;
    padding: 16px 24px 40px;
    z-index: 2;
    scrollbar-width: none;
    -ms-overflow-style: none;
  }
  .content::-webkit-scrollbar {
    display: none;
  }

  /* ==========================================
     PROJECTS GRID
     ========================================== */
  .projects {
    display: grid;
    grid-template-columns: 1fr;
    gap: 20px;
    max-width: 520px;
    margin: 0 auto;
  }

  @media (min-width: 640px) {
    .projects {
      grid-template-columns: repeat(2, 1fr);
    }
  }

  .project-card {
    position: relative;
    background: #0a0806;
    border: 1.5px solid rgba(245, 166, 35, 0.28);
    border-radius: 10px;
    overflow: hidden;
    text-decoration: none;
    color: inherit;
    transition: all 0.5s var(--ease);
    opacity: 0;
    transform: translateY(30px);
    animation: cardIn 0.9s var(--ease) forwards;
  }

  @keyframes cardIn {
    to { opacity: 1; transform: translateY(0); }
  }

  .project-card:nth-child(1) { animation-delay: 0.4s; }
  .project-card:nth-child(2) { animation-delay: 0.55s; }
  .project-card:nth-child(3) { animation-delay: 0.7s; }
  .project-card:nth-child(4) { animation-delay: 0.85s; }
  .project-card:nth-child(5) { animation-delay: 1.0s; }
  .project-card:nth-child(6) { animation-delay: 1.15s; }

  .project-card:hover,
  .project-card:active {
    border-color: var(--orange-l);
    box-shadow: 0 0 24px rgba(245, 166, 35, 0.25);
    transform: translateY(-3px);
  }

  .project-thumb {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 10;
    background: linear-gradient(135deg, #0d0a08, #050403);
    overflow: hidden;
    border-bottom: 1px solid rgba(245, 166, 35, 0.15);
  }

  .project-thumb svg {
    width: 100%;
    height: 100%;
    display: block;
  }

  .project-info {
    padding: 14px 16px 16px;
  }

  .project-tag {
    display: inline-block;
    font-family: 'Vazirmatn', 'Inter', sans-serif;
    font-size: 0.62rem;
    font-weight: 500;
    color: var(--orange-l);
    background: rgba(245, 166, 35, 0.1);
    border: 1px solid rgba(245, 166, 35, 0.3);
    padding: 3px 10px;
    border-radius: 12px;
    margin-bottom: 8px;
    letter-spacing: 0.3px;
  }

  .project-title {
    font-family: 'Vazirmatn', 'Inter', sans-serif;
    font-size: 1rem;
    font-weight: 600;
    color: #f0e6d2;
    margin-bottom: 4px;
    letter-spacing: 0.2px;
  }

  .project-meta {
    font-family: 'Inter', sans-serif;
    font-size: 0.72rem;
    font-weight: 400;
    color: #7a6f5c;
    letter-spacing: 0.3px;
  }

  /* ==========================================
     BOTTOM DOCK — hidden by default, toggle on tap
     ========================================== */
  .dock {
    position: absolute;
    bottom: calc(2vh + var(--safe-bottom));
    left: 6vw;
    right: 6vw;
    max-width: 480px;
    margin-inline: auto;
    padding: 12px 8px;
    opacity: 0;
    transform: translateY(40px);
    pointer-events: none;
    transition: opacity 0.9s var(--ease), transform 0.9s var(--ease);
    z-index: 10;
  }

  body.dock-visible .dock {
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto;
  }

  .dock-inner {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 2px;
  }

  .dock-btn {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 5px;
    padding: 6px 2px;
    text-decoration: none;
    background: none;
    border: none;
    cursor: pointer;
    opacity: 0;
    transform: translateY(20px) scale(0.7);
  }

  body.dock-visible .dock-btn {
    animation: btnIn 0.7s var(--ease) forwards;
  }
  body.dock-visible .dock-btn:nth-child(1) { animation-delay: 0.10s; }
  body.dock-visible .dock-btn:nth-child(2) { animation-delay: 0.20s; }
  body.dock-visible .dock-btn:nth-child(3) { animation-delay: 0.30s; }
  body.dock-visible .dock-btn:nth-child(4) { animation-delay: 0.40s; }
  body.dock-visible .dock-btn:nth-child(5) { animation-delay: 0.50s; }
  body.dock-visible .dock-btn:nth-child(6) { animation-delay: 0.60s; }
  body.dock-visible .dock-btn:nth-child(7) { animation-delay: 0.70s; }

  @keyframes btnIn {
    0% { opacity: 0; transform: translateY(20px) scale(0.7); }
    70% { opacity: 1; transform: translateY(-3px) scale(1.06); }
    100% { opacity: 1; transform: translateY(0) scale(1); }
  }

  .dock-btn svg {
    width: 24px;
    height: 24px;
    fill: none;
    stroke: url(#iconGrad);
    stroke-width: 1.7;
    stroke-linecap: round;
    stroke-linejoin: round;
    filter: drop-shadow(0 0 6px rgba(245, 166, 35, 0.55));
    transition: transform 0.4s var(--ease), filter 0.4s var(--ease);
  }

  .dock-btn:active svg {
    transform: scale(0.85);
    filter: drop-shadow(0 0 12px rgba(245, 166, 35, 0.9));
  }

  .dock-btn.active svg {
    filter: drop-shadow(0 0 10px rgba(245, 166, 35, 0.85));
  }

  .dock-btn .lbl {
    font-family: 'Vazirmatn', 'Inter', sans-serif;
    font-size: 0.58rem;
    font-weight: 500;
    color: #8a7a5f;
    transition: color 0.4s var(--ease);
    white-space: nowrap;
  }

  .dock-btn.active .lbl,
  .dock-btn:active .lbl {
    color: var(--orange-l);
  }

  .dock-line {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 2px;
    background-image: linear-gradient(90deg,
      var(--orange-l) 0 4px,
      transparent 4px 8px);
    background-size: 8px 100%;
    opacity: 0;
    transition: opacity 0.9s var(--ease) 0.3s;
  }

  body.dock-visible .dock-line {
    opacity: 0.85;
  }

  /* ==========================================
     MOBILE TUNING
     ========================================== */
  @media (max-width: 380px) {
    .small-line {
      font-size: 10px;
    }
    .big-line {
      font-size: 20px;
    }
    .filter-btn {
      font-size: 0.8rem;
    }
    .dock-btn svg {
      width: 22px;
      height: 22px;
    }
    .dock-btn .lbl {
      font-size: 0.54rem;
    }
    .project-title {
      font-size: 0.92rem;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    * {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
    .project-card { opacity: 1; transform: none; }
    .big-line .letter { opacity: 1; transform: none; }
    .small-line { opacity: 1; transform: none; }
    .dock-btn { opacity: 1; }
    .dock { opacity: 1; transform: none; }
  }
</style>
</head>
<body>

  <!-- Hidden SVG defs -->
  <svg width="0" height="0" style="position:absolute;width:0;height:0;">
    <defs>
      <linearGradient id="iconGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#ffc761"/>
        <stop offset="100%" stop-color="#e08b1f"/>
      </linearGradient>
      <linearGradient id="thumbGrad1" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#ffc761"/>
        <stop offset="100%" stop-color="#e08b1f"/>
      </linearGradient>
      <linearGradient id="thumbGrad2" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#e08b1f"/>
        <stop offset="100%" stop-color="#ffc761"/>
      </linearGradient>
    </defs>
  </svg>

  <!-- ========== PAGE FRAME ========== -->
  <div class="page-frame" aria-hidden="true">

    <span class="corner tr"></span>
    <span class="corner bl"></span>
    <span class="corner br"></span>

  <!-- ========== HEADER ========== -->

    <div class="big-line" id="bigLine" aria-label="ZigguratProjects"></div>

  <!-- ========== FILTERS (horizontal scroll, text only) ========== -->
  <div class="filters" id="filters">

      <button class="filter-btn" data-filter="office">اداری</button>

  <!-- ========== CONTENT ========== -->
  <div class="content">

    <!-- Projects grid -->
    <div class="projects" id="projectsGrid">

      <!-- 1. Villa -->
      <a class="project-card" data-cat="villa" href="#">
        <div class="project-thumb">

            <path d="M60 170 L60 100 L160 40 L260 100 L260 170 Z" fill="none" stroke="url(#thumbGrad1)" stroke-width="1.8"/>
            <line x1="60" y1="130" x2="160" y2="70" stroke="#f5a623" stroke-width="1" opacity="0.4"/>

            <rect x="140" y="135" width="20" height="35" fill="url(#thumbGrad1)" opacity="0.75"/>
            <circle cx="265" cy="50" r="18" stroke="#f5a623" stroke-width="1.2" fill="none" opacity="0.6"/>
          </svg>
        </div>
        <div class="project-info">
          <span class="project-tag">ویلایی</span>
          <div class="project-title">ویلا ساحلی رویان</div>

        </div>

      <!-- 2. Residential -->
      <a class="project-card" data-cat="residential" href="#">

      <!-- 4. Renovation -->
      <a class="project-card" data-cat="renovation" href="#">
        <div class="project-thumb">
          <svg viewBox="0 0 320 200" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
            <rect width="320" height="200" fill="#0a0806"/>
            <line x1="20" y1="175" x2="300" y2="175" stroke="#f5a623" stroke-width="1.5" opacity="0.7"/>
            <rect x="50" y="60" width="90" height="115" fill="none" stroke="#f5a623" stroke-width="1.2" opacity="0.35" stroke-dasharray="4 4"/>
            <rect x="150" y="50" width="120" height="125" fill="none" stroke="url(#thumbGrad1)" stroke-width="1.8"/>
            <rect x="165" y="75" width="25" height="30" fill="#f5a623" opacity="0.3"/>
            <rect x="200" y="75" width="25" height="30" fill="#f5a623" opacity="0.3"/>
            <rect x="235" y="75" width="25" height="30" fill="#f5a623" opacity="0.3"/>
            <rect x="165" y="120" width="25" height="30" fill="#f5a623" opacity="0.3"/>
            <rect x="200" y="120" width="25" height="30" fill="#f5a623" opacity="0.3"/>

  <script>
    (function () {
      "use strict";

      // ==========================================
      // BUILD TITLE — letter by letter (LTR)
      // ==========================================
      const bigLine = document.getElementById("bigLine");
      const text = "ZigguratProjects";
      let html = "";
      for (let i = 0; i < text.length; i++) {
        const delay = (0.5 + i * 0.07).toFixed(2);
        html += '<span class="letter" style="animation-delay:' + delay + 's">' + text[i] + '</span>';
      }
      bigLine.innerHTML = html;

      // ==========================================
      // FILTER
      // ==========================================
      const filterBtns = document.querySelectorAll(".filter-btn");
      const projectCards = document.querySelectorAll(".project-card");

      filterBtns.forEach(function (btn) {
        btn.addEventListener("click", function () {
          const filter = btn.dataset.filter;

          filterBtns.forEach(function (b) { b.classList.remove("active"); });
          btn.classList.add("active");

          projectCards.forEach(function (card, idx) {
            const cat = card.dataset.cat;
            const match = (filter === "all" || cat === filter);

            if (match) {
              card.style.display = "";
              card.style.animation = "none";
              void card.offsetWidth;
              card.style.animation = "cardIn 0.7s var(--ease) " + (idx * 0.05) + "s forwards";
            } else {
              card.style.display = "none";
            }
          });
        });
      });

      // ==========================================
      // TOGGLE DOCK ON PAGE TAP
      // ==========================================
      const body = document.body;

      // Enable toggle after a short entrance delay
      let ready = false;
      setTimeout(function () { ready = true; }, 2500);

      // Listen for taps on the whole page (excluding links/buttons and scrollable areas)
      document.addEventListener("click", function (e) {
        // Ignore taps on links, buttons, and the dock itself
        if (e.target.closest("a, button, .dock, .filters")) return;
        // Ignore taps inside the scrollable content (so scrolling doesn't toggle)
        if (e.target.closest(".content")) return;

        if (!ready) return;
        body.classList.toggle("dock-visible");
      });

      // ==========================================
      // Prevent double-tap zoom & pinch zoom
      // ==========================================
      let lastTouchEnd = 0;
      document.addEventListener("touchend", function (event) {
        const now = Date.now();
        if (now - lastTouchEnd <= 300) event.preventDefault();
        lastTouchEnd = now;
      }, { passive: false });

      document.addEventListener("touchmove", function (e) {
        if (e.touches.length > 1) e.preventDefault();
      }, { passive: false });

    })();
  </script>
